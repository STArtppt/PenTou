<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pentou Collector Options</title>
  </head>
  <body>
    <main class="shell">
      <header>
        <h1>Pentou Collector</h1>
        <p>Configure where this extension sends captured conversations.</p>
      </header>

      <section>
        <label>
          Pentou server
          <input id="server" autocomplete="off" />
        </label>
        <label>
          Ingest token
          <input id="token" type="password" autocomplete="off" />
        </label>
        <div class="actions">
          <button id="test" type="button">Test connection</button>
          <button id="save" type="button">Save</button>
        </div>
        <p id="status" role="status"></p>
      </section>

      <section>
        <h2>Platforms</h2>
        <!-- 开关条目由 index.ts 按 SUPPORTED_PLATFORMS 清单派生，勿在此硬编码平台结构 -->
        <div id="platforms"></div>
      </section>

      <section>
        <h2>Offline queue</h2>
        <p id="queue"></p>
      </section>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
